[tools]
node = "24.15.0"
pnpm = "11.28.10"
hk = "2.11.1"
pkl = "0.30.2"
rust = "1.99.1"
# Узкие исключения регистрации типов маршрутов: mokevnin/easement#134.
"cargo:t3m8ch/easement" = { version = "rev:de20a5db94dd2db5c12ccdd2f1b734af3556d189", locked = true }
jactionlint = "2.3.0"
shellcheck = "0.11.0"
lychee = "0.22.0"
"pipx:podman-compose" = "1.6.0"

[env]
DATABASE_URL = "postgres://mm:mm@127.0.0.1:54329/mm"
TEST_DATABASE_URL = "postgres://mm:mm@127.0.0.1:54329/mm"

[tasks.check]
run = [
  "pnpm format:check",
  "pnpm lint",
  "pnpm typecheck",
  "pnpm boundaries",
  "pnpm unused",
  "jactionlint",
]
