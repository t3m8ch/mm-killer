version: 1
components:
  # plop:components
  platform: { in: src/platform, public: ["src/platform/**/*.public.*"] }
  courses:
    { in: src/modules/courses, public: ["src/modules/courses/**/*.public.*"], optional: true }
  invitations:
    {
      in: src/modules/invitations,
      public: ["src/modules/invitations/**/*.public.*"],
      optional: true,
    }
  tasks: { in: src/modules/tasks, public: ["src/modules/tasks/**/*.public.*"], optional: true }
  attempts:
    { in: src/modules/attempts, public: ["src/modules/attempts/**/*.public.*"], optional: true }
  reviews:
    { in: src/modules/reviews, public: ["src/modules/reviews/**/*.public.*"], optional: true }
  git: { in: src/modules/git, public: ["src/modules/git/**/*.public.*"], optional: true }
  notifications:
    {
      in: src/modules/notifications,
      public: ["src/modules/notifications/**/*.public.*"],
      optional: true,
    }
  app: { in: [src/app, src/routes, src/router.tsx] }
  generated: { in: src/routeTree.gen.ts }
  test_helpers: { in: tests/helpers, allow_importers: [tests] }
  tests: { in: ["**/*.test.ts", tests/e2e, tests/tooling], priority: 10, optional: true }
  tooling: { in: ["*.ts", scripts], priority: -1 }
rules:
  # plop:rules
  platform: { may_depend_on: [] }
  courses: { may_depend_on: [platform] }
  invitations: { may_depend_on: [platform, courses] }
  tasks: { may_depend_on: [platform, courses] }
  attempts: { may_depend_on: [platform, tasks] }
  reviews: { may_depend_on: [platform, attempts] }
  git: { may_depend_on: [platform, attempts] }
  notifications: { may_depend_on: [platform, tasks] }
  app:
    may_depend_on:
      # plop:app-dependencies
      - platform
      - courses
      - invitations
      - tasks
      - attempts
      - reviews
      - git
      - notifications
      - generated
  generated: { may_depend_on: [app] }
  test_helpers: { may_depend_on: [platform] }
  tests:
    may_depend_on:
      # plop:test-dependencies
      - platform
      - courses
      - invitations
      - tasks
      - attempts
      - reviews
      - git
      - notifications
      - test_helpers
  tooling: { may_depend_on: [platform] }
no_cycles: [platform, courses, invitations, tasks, attempts, reviews, git, notifications]
exclude: [".agents/**", ".claude/**", ".codex/**", "generators/**"]
