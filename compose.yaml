services:
  postgres:
    image: docker.io/library/postgres:18.1
    environment:
      POSTGRES_USER: mm
      POSTGRES_PASSWORD: mm
      POSTGRES_DB: mm
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mm"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres:/var/lib/postgresql
volumes:
  postgres:
