name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.1@sha256:2ccc3d98b960df5ed1ee2d32d3d5338a3c688cf899c0e951ce6d45fb07395abc
        env:
          POSTGRES_USER: mm
          POSTGRES_PASSWORD: mm
          POSTGRES_DB: mm
        ports: ["54329:5432"]
        options: --health-cmd "pg_isready -U mm" --health-interval 2s --health-timeout 2s --health-retries 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      - run: pnpm install --frozen-lockfile
      - run: mise run check
      - run: pnpm test:guards
      - run: pnpm test
      - run: pnpm db:migrate
      - run: env -u DATABASE_URL pnpm build
      - run: pnpm test:runtime
      - run: pnpm test:bundle
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: lychee --no-progress README.md docs/**/*.md
