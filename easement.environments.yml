version: 1
# Разрешить только неявные связи через регистрацию типов TanStack Router.
# Прямые импорты файлов приложения и остальные транзитивные цепочки проверяются.
accept_augmentations:
  - consumers: [ui]
    module: "@tanstack/react-router"
    declaration: src/router.tsx
    because: использовать тип зарегистрированного роутера в ссылках
  - consumers: [ui]
    module: "@tanstack/react-router"
    declaration: src/app/navigation.tsx
    because: использовать постоянные метаданные навигации маршрутов
  - consumers: [ui]
    module: "@tanstack/react-router"
    declaration: src/routeTree.gen.ts
    because: использовать сгенерированные типы маршрутов
components:
  server: { in: ["src/**/*.server.ts", "src/**/*.server.tsx"], optional: true }
  shared: { in: ["src/**/*.shared.ts"], optional: true }
  browser: { in: ["src/**/*.browser.ts", "src/**/*.browser.tsx"], optional: true }
  ui: { in: ["src/**/*.ui.ts", "src/**/*.ui.tsx"], optional: true }
  integration: { in: [src, tests, scripts, "*.ts", "*.js"], priority: -1 }
rules:
  server: { may_depend_on: [shared, ui, integration], must_not_reach: [browser] }
  shared:
    {
      may_depend_on: [],
      forbid_external:
        [
          "node:*",
          fs,
          crypto,
          path,
          os,
          child_process,
          net,
          tls,
          pg,
          pg-pool,
          drizzle-orm,
          "@orpc/server",
          nitro,
          react,
          react-dom,
          "@mantine/core",
          "@tanstack/react-start/server",
        ],
      must_not_reach: [server, browser, ui, integration],
    }
  browser:
    {
      may_depend_on: [shared, ui],
      forbid_external:
        [
          "node:*",
          fs,
          crypto,
          path,
          os,
          child_process,
          net,
          tls,
          pg,
          pg-pool,
          drizzle-orm,
          "@orpc/server",
          nitro,
          "@tanstack/react-start/server",
        ],
      must_not_reach: [server, integration],
    }
  ui:
    {
      may_depend_on: [shared],
      forbid_external:
        [
          "node:*",
          fs,
          crypto,
          path,
          os,
          child_process,
          net,
          tls,
          pg,
          pg-pool,
          drizzle-orm,
          "@orpc/server",
          nitro,
          "@tanstack/react-start/server",
        ],
      must_not_reach: [server, browser, integration],
    }
  integration: { may_depend_on: [server, shared, browser, ui] }
exclude: [".agents/**", ".claude/**", ".codex/**", "generators/**"]
